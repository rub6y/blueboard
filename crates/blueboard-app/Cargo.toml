[package]
name = "blueboard-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "blueboard"
path = "src/main.rs"

[dependencies]
# OS clipboard image read for `:paste` falling back to an external image (no board
# elements yanked) — see `commands.rs`'s `PasteCommand`. `wayland-data-control` isn't in
# arboard's default features (only `image-data`, for format decoding, is) — without it,
# arboard only talks to the clipboard via X11, which doesn't reliably bridge image data
# copied by a native Wayland app on a Wayland-native session (this machine's actual
# desktop, per `nixos.md`'s own notes on needing `WAYLAND_DISPLAY` handling for winit).
arboard = { version = "3", features = ["wayland-data-control"] }
blueboard-core = { path = "../blueboard-core" }
blueboard-render = { path = "../blueboard-render" }
# Only for constructing the handful of input events forwarded to the color picker (see
# `main.rs`'s `screen_to_egui_points`) — must match `blueboard-render`'s egui version,
# since these events cross the crate boundary into `Renderer::push_egui_event`.
egui = "0.36.2"
glam = "0.34.1"
# Decodes `:background image <path>` (PNG/JPEG/etc) into raw RGBA8 pixels for
# `Renderer::set_background_image` — only `blueboard-app` touches image files, so the
# decode step lives here rather than in `blueboard-render`.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
kurbo = "0.13.1"
log = { version = "0.4.34", features = ["std"] }
pollster = "1.0.1"
# Spawns the real shell behind a magic window (`terminal.rs`); `vte` parses its output
# (just the ANSI/VT escape-sequence state machine, not a full terminal emulator like
# `alacritty_terminal` — deliberately minimal, see `terminal.rs`'s doc comment).
portable-pty = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.7"
vte = "0.15"
winit = "0.30.13"
